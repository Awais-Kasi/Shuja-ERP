name: Deploy to production

# Runs on every push to main (code OR new migrations), and can be triggered
# by hand from the Actions tab. Assets are built here in CI — the server needs
# no Node — then shipped over SSH, where composer + migrations + cache run.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys overlap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # The Wayfinder Vite plugin runs `php artisan wayfinder:generate` during the
      # build, so CI needs PHP + vendor + a bootable .env to compile the assets.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gmp, bcmath, dom, xml, tokenizer, ctype, curl, fileinfo, openssl, gd, zip, pdo_pgsql, pgsql, iconv, sodium
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: |
          cp .env.example .env
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build front-end assets
        run: |
          npm ci
          npm run build
          tar -czf build.tar.gz -C public build

      - name: Copy built assets to the server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: build.tar.gz
          target: /home/makran

      - name: Pull code, install deps, migrate, cache
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/makran/htdocs/makranindustries.com
            git fetch origin main
            git reset --hard origin/main
            mkdir -p storage/app
            printf '{"commit":"%s","deployed_at":"%s"}' "$(git rev-parse --short HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > storage/app/version.json
            composer install --no-dev --optimize-autoloader --no-interaction
            rm -rf public/build
            tar -xzf /home/makran/build.tar.gz -C public
            rm -f /home/makran/build.tar.gz
            php8.4 artisan migrate --force
            php8.4 artisan optimize:clear
            php8.4 artisan optimize
